server {
    listen      80;
    server_name _;
    root        /usr/share/nginx/html;
    index       index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml;

    client_max_body_size 100M;

    # Hashed assets — cache forever.
    location ~* \.(js|css|woff2?|ttf|eot|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html — never cache (entry point; must revalidate so a rebuild is
    # picked up immediately instead of pointing at a stale bundle).
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        expires -1;
    }

    # System-config endpoints: /api/admin/* → admin-api /v1/admin/*
    # (mirrors the Vite dev proxy in vite.config.ts).
    location /api/admin/ {
        proxy_pass          http://ask-admin-api:8081/v1/admin/;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_buffering     off;
    }

    # SPA fallback — all React routes resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
