# Onibex-branded Keycloak login theme.
#
# Extends the stock `keycloak` login theme: `css/login.css` resolves to the
# parent's base stylesheet (this theme ships no file by that name, so resource
# lookup falls through to the parent), and `css/onibex.css` layers our brand
# overrides on top. Keep both — dropping `css/login.css` loses the base layout.
parent=keycloak
import=common/keycloak
styles=css/login.css css/onibex.css
