[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ask-admin-api"
version = "0.1.0"
description = "ASK Platform — Admin API: dictionary CRUD + ingestion endpoints consumed by the admin SPA. Physically separate from ask-orchestrator (different pod, different audience)."
requires-python = ">=3.11"
license = {text = "PolyForm Strict 1.0.0 / Free Trial 1.0.0 — see LICENSE.md"}
classifiers = ["License :: Other/Proprietary License"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",  # FastAPI Form/UploadFile (docs ingest) requires it at import time
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "sap-xssec>=4.1",
    "ask-knowledge-graph",   # local — dictionary writer + ingestion service factories
    "ask-llm-gateway",       # local — embedder for ingestion / dictionary writes
    "ask-sql-executor",      # local — DB connection probe for /db/connections/{id}/test
    "psycopg2-binary>=2.9",  # PG connection test (db_utils imports psycopg2 at module load)
    "python-dotenv>=1.0",    # db_utils imports dotenv at module load
    "gitpython>=3.1",        # viz: git versioning of YAML files
    "ruamel.yaml>=0.18",     # the one YAML library — round-trip parse + serialize (YAML 1.2)
    "httpx>=0.27",           # validator: JWKS fetch
    "python-jose[cryptography]>=3.3",  # validator: JWT decode + signature verification
    "structlog>=24.1",                  # JSON-structured logging (queryable in prod)
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "import-linter>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
