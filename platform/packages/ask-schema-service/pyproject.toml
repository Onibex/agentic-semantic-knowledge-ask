[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ask-schema-service"
version = "1.1.0"
description = "ASK Platform — Schema service (handles SCHEMA_QUERY macro intent)"
requires-python = ">=3.11"
license = {text = "PolyForm Strict 1.0.0 / Free Trial 1.0.0 — see LICENSE.md"}
classifiers = ["License :: Other/Proprietary License"]
dependencies = [
    "pydantic>=2.7",
    "ruamel.yaml>=0.18",  # schema-catalog fallback renders entity dict to YAML (single YAML 1.2 lib)
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "import-linter>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
