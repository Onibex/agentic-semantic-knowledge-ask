# ─────────────────────────────────────────────────────────────────────────────
# ASK Studio (ASK Studio) — nginx static bundle + reverse proxy
# Namespace: onibex-ask (same as orchestrator + admin-api)
#
# The SPA authenticates via browser-side PKCE (Keycloak or XSUAA) — no
# server-side JWT validation is needed here.  The APIRule is noAuth: true;
# all API traffic is forwarded to ask-admin-api-service:8081 through nginx.
#
# nginx routing (nginx.conf baked into the image):
#   /api/admin/*  →  ask-admin-api:8081/v1/admin/*
#   /api/*        →  ask-admin-api:8081/v1/viz/*
#
# Auth configuration is read at CONTAINER START from the ask-spa-config
# ConfigMap, not baked into the image. To use a different IDP, edit that
# ConfigMap and roll out:
#   kubectl -n onibex-ask edit configmap ask-spa-config
#   kubectl -n onibex-ask rollout restart deployment/ask-studio
#
# One image therefore serves every cluster. ASK_KEYCLOAK_URL ships EMPTY on
# purpose: the entrypoint stops the container and names the variable rather
# than falling back to a host that does not exist. See the ConfigMap for why.
# ─────────────────────────────────────────────────────────────────────────────
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ask-studio
  namespace: onibex-ask
  labels:
    app: ask-studio
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: ask-studio
  template:
    metadata:
      labels:
        app: ask-studio
    spec:
      containers:
        - name: ask-studio
          image: <your-registry>/onibex-ask-studio:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          # Rendered into /config.js by the entrypoint at container start.
          # Listed one by one rather than with envFrom so that the four the
          # image actually requires are visible here: a reader should not have
          # to open the ConfigMap to learn what makes this pod refuse to boot.
          env:
            - name: ASK_AUTH_MODE
              valueFrom:
                configMapKeyRef:
                  name: ask-spa-config
                  key: ASK_AUTH_MODE
            - name: ASK_KEYCLOAK_URL
              valueFrom:
                configMapKeyRef:
                  name: ask-spa-config
                  key: ASK_KEYCLOAK_URL
            - name: ASK_KEYCLOAK_REALM
              valueFrom:
                configMapKeyRef:
                  name: ask-spa-config
                  key: ASK_KEYCLOAK_REALM
            - name: ASK_KEYCLOAK_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: ask-spa-config
                  key: ASK_KEYCLOAK_CLIENT_ID
            # Optional: empty hides the cross-app link instead of breaking it.
            # `optional: true` so the pod still starts if a cluster's ConfigMap
            # predates these keys.
            - name: ASK_SETUP_SPA_URL
              valueFrom:
                configMapKeyRef:
                  name: ask-spa-config
                  key: ASK_SETUP_SPA_URL
                  optional: true
            - name: ASK_CHAT_URL
              valueFrom:
                configMapKeyRef:
                  name: ask-spa-config
                  key: ASK_CHAT_URL
                  optional: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ask-studio-service
  namespace: onibex-ask
spec:
  selector:
    app: ask-studio
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
# External exposure is target-specific, so it does not live in this file. The
# Kyma APIRule moved to deploy/kyma/, which only applies on a Kyma cluster; on
# EKS and AKS the Helm chart adds an Ingress in phase 4. Until then, reach this
# service with `kubectl port-forward svc/ask-studio-service 8080:80`.
