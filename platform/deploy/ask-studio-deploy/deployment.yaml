# ─────────────────────────────────────────────────────────────────────────────
# ASK Studio (ASK Studio) — nginx static bundle + reverse proxy
# Namespace: onibex-ask (same as orchestrator + admin-api)
#
# The SPA authenticates via browser-side PKCE (Keycloak or XSUAA) — no
# server-side JWT validation is needed here.  The APIRule is noAuth: true;
# all API traffic is forwarded to ask-admin-api-service:8081 through nginx.
#
# nginx routing (nginx.conf baked into the image):
#   /api/admin/*  →  ask-admin-api:8081/v1/admin/*
#   /api/*        →  ask-admin-api:8081/v1/viz/*
#
# Auth env-vars (VITE_*) are baked at image build time via Dockerfile ARGs.
# To use a different IDP, rebuild the image with:
#   docker build --build-arg VITE_AUTH_MODE=xsuaa \
#                --build-arg VITE_XSUAA_URL=https://... \
#                --build-arg VITE_XSUAA_CLIENT_ID=... \
#                -t <your-registry>/onibex-ask-studio:latest .
# ─────────────────────────────────────────────────────────────────────────────
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ask-studio
  namespace: onibex-ask
  labels:
    app: ask-studio
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: ask-studio
  template:
    metadata:
      labels:
        app: ask-studio
    spec:
      containers:
        - name: ask-studio
          image: <your-registry>/onibex-ask-studio:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ask-studio-service
  namespace: onibex-ask
spec:
  selector:
    app: ask-studio
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
# External exposure is target-specific, so it does not live in this file. The
# Kyma APIRule moved to deploy/kyma/, which only applies on a Kyma cluster; on
# EKS and AKS the Helm chart adds an Ingress in phase 4. Until then, reach this
# service with `kubectl port-forward svc/ask-studio-service 8080:80`.
