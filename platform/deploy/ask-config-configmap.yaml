# ─────────────────────────────────────────────────────────────────────────────
# config/settings.json as a read-only ConfigMap.
#
# This file is what replaced the shared read-write volume. Until 2026-09-09
# settings.json
# was written at runtime, a writable file has to live on a ReadWriteOnce volume,
# an RWO volume can only be mounted by pods on one node, and that is why both
# backends carried a podAffinity onto a pod that no longer exists. Six PRs
# removed every writer, so the file is now deploy-time tuning that an operator
# edits and a rollout picks up.
#
# It carries EXACTLY the one section that still has a live reader, and its
# content must stay in step with platform/config/settings.example.json.
#
# Deliberately absent: an `opensearch` section. Every OpenSearch client resolves
# OPENSEARCH_* from the environment in all nine construction sites, pinned by
# platform/tests/integration/test_opensearch_connection_sources.py. A section
# here would be read by nothing and would mislead the next operator. Nor is
# there anything for SAP AI Core: its service key is a credential and lives in
# the encrypted store, entered in ASK Setup like every other provider's.
#
# Both backends mount this with subPath: settings.json, so only that one file is
# overlaid. A whole-directory mount would shadow /app/config in the orchestrator
# image, which bakes the folder at Dockerfile:141.
# ─────────────────────────────────────────────────────────────────────────────
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ask-config
  namespace: onibex-ask
  labels:
    app.kubernetes.io/part-of: onibex-ask
data:
  settings.json: |
    {
      "hybrid_pipeline": {
        "anchor_top_k": 3,
        "expand_max_hops": 1,
        "expand_max_total": 5,
        "use_two_pass_flow": true,
        "max_expansion_rounds": 1
      }
    }
