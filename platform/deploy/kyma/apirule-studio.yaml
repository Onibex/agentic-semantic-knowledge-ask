# Kyma only. See README.md in this folder.
#
# noAuth: true is deliberate. The SPA authenticates in the browser with PKCE
# and every API call is proxied by its own nginx to ask-admin-api inside the
# cluster, so there is no server-side token check to delegate to the gateway.
---
apiVersion: gateway.kyma-project.io/v2
kind: APIRule
metadata:
  name: ask-studio-apirule
  namespace: onibex-ask
spec:
  hosts:
    - ask-studio.<YOUR_CLUSTER_DOMAIN>
  service:
    name: ask-studio-service
    port: 80
  gateway: kyma-system/kyma-gateway
  rules:
    - path: /*
      methods: ["GET", "POST", "PUT", "DELETE", "PATCH", "OPTIONS"]
      noAuth: true
