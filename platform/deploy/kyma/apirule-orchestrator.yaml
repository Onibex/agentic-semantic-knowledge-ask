# Kyma only. See README.md in this folder.
#
# noAuth: true is deliberate. The orchestrator validates the JWT in process
# (auth/validator.py), so the gateway must let the request through with the
# Authorization header intact rather than validating it a second time.
---
apiVersion: gateway.kyma-project.io/v2
kind: APIRule
metadata:
  name: ask-orchestrator-apirule
  namespace: onibex-ask
spec:
  hosts:
    - ask-orchestrator.<YOUR_CLUSTER_DOMAIN>
  service:
    name: ask-orchestrator-service
    port: 80
  gateway: kyma-system/kyma-gateway
  rules:
    - path: /*
      methods: ["GET", "POST", "OPTIONS"]
      noAuth: true
