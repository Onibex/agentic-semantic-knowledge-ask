# ─────────────────────────────────────────────────────────────────────────────
# Keycloak, the identity provider, with an off switch.
#
# Switch it off when the issuer lives elsewhere: an existing corporate Keycloak,
# SAP IAS, or XSUAA on the BTP target. The backends then need auth.jwksUrl, or
# auth.mode=xsuaa with the XSUAA Secret.
#
# KC_HOSTNAME_URL is the browser-facing origin and it is not cosmetic: it is the
# issuer Keycloak stamps into every token, and the backends reject a token whose
# issuer does not match what they were told to expect. One address, declared
# once in auth.publicUrl, is what keeps the two halves in step.
# ─────────────────────────────────────────────────────────────────────────────
{{- if .Values.keycloak.enabled }}
{{- if .Values.keycloak.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "onibex-ask.fullname" . }}-keycloak
  labels:
    {{- include "onibex-ask.labels" (dict "ctx" . "component" "keycloak") | nindent 4 }}
  annotations:
    # Kept on uninstall: this is where the users and their passwords live.
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.keycloak.persistence.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.keycloak.persistence.size }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "onibex-ask.fullname" . }}-keycloak
  labels:
    {{- include "onibex-ask.labels" (dict "ctx" . "component" "keycloak") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "onibex-ask.selectorLabels" (dict "ctx" . "component" "keycloak") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "onibex-ask.fullname" . }}-keycloak
  labels:
    {{- include "onibex-ask.labels" (dict "ctx" . "component" "keycloak") | nindent 4 }}
spec:
  replicas: 1
  strategy:
    # Recreate, not RollingUpdate. In development mode the state is an embedded
    # file database, on the Keycloak volume when persistence is on, and two
    # instances would diverge or fight over the same file; in
    # production mode a rolling upgrade across schema versions is a Keycloak
    # upgrade procedure, not a deployment strategy.
    type: Recreate
  selector:
    matchLabels:
      {{- include "onibex-ask.selectorLabels" (dict "ctx" . "component" "keycloak") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "onibex-ask.labels" (dict "ctx" . "component" "keycloak") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "onibex-ask.serviceAccountName" . }}
      {{- include "onibex-ask.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: keycloak
          image: "{{ .Values.keycloak.image.repository }}:{{ .Values.keycloak.image.tag }}"
          imagePullPolicy: {{ .Values.keycloak.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          args:
            - {{ if .Values.keycloak.production }}start{{ else }}start-dev{{ end }}
            {{- if or .Values.keycloak.realmImportSecret .Values.keycloak.realmImportConfigMap }}
            - --import-realm
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: KEYCLOAK_ADMIN
              value: {{ .Values.keycloak.adminUser | quote }}
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "onibex-ask.secretName" . }}
                  key: {{ .Values.secrets.keys.keycloakAdminPassword }}
            - name: KC_HTTP_PORT
              value: "8080"
            - name: KC_HOSTNAME_URL
              value: {{ .Values.auth.publicUrl | quote }}
            - name: KC_HOSTNAME_STRICT
              value: "false"
            - name: KC_HOSTNAME_STRICT_HTTPS
              value: "false"
            # Behind an Ingress or any reverse proxy, Keycloak issues http
            # redirects and the login flow breaks unless it is told the
            # connection was terminated upstream. This is the classic failure of
            # this exact migration.
            - name: KC_PROXY_HEADERS
              value: {{ .Values.keycloak.proxyHeaders | quote }}
            - name: KC_HTTP_ENABLED
              value: {{ .Values.keycloak.httpEnabled | quote }}
            # In Keycloak 24 the health endpoints are served on the main port.
            # The dedicated management port only exists from 25 onwards.
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_LOG_LEVEL
              value: WARN
            # Without this the JVM sizes its heap from the memory of the NODE,
            # not of the container, and takes about 2GB it does not need.
            - name: JAVA_OPTS_KC_HEAP
              value: {{ .Values.keycloak.javaOpts | quote }}
            {{- if .Values.keycloak.production }}
            - name: KC_DB
              value: {{ .Values.keycloak.database.vendor | quote }}
            - name: KC_DB_URL_HOST
              value: {{ .Values.keycloak.database.host | quote }}
            - name: KC_DB_URL_PORT
              value: {{ .Values.keycloak.database.port | quote }}
            - name: KC_DB_URL_DATABASE
              value: {{ .Values.keycloak.database.name | quote }}
            - name: KC_DB_USERNAME
              value: {{ .Values.keycloak.database.user | quote }}
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "keycloak.database.existingSecret is required when keycloak.production is true." .Values.keycloak.database.existingSecret }}
                  key: {{ .Values.keycloak.database.passwordKey }}
            {{- end }}
          resources:
            {{- toYaml .Values.keycloak.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 90
            periodSeconds: 30
          volumeMounts:
            {{- if or .Values.keycloak.realmImportSecret .Values.keycloak.realmImportConfigMap }}
            - name: realm-import
              mountPath: /opt/keycloak/data/import
              readOnly: true
            {{- end }}
            {{- if .Values.keycloak.persistence.enabled }}
            - name: data
              mountPath: /opt/keycloak/data
              subPath: keycloak
            {{- end }}
      volumes:
        {{- if .Values.keycloak.realmImportSecret }}
        # A realm file carries user passwords, so a Secret is its right home.
        # Imported on FIRST boot only.
        - name: realm-import
          secret:
            secretName: {{ .Values.keycloak.realmImportSecret }}
        {{- else if .Values.keycloak.realmImportConfigMap }}
        - name: realm-import
          configMap:
            name: {{ .Values.keycloak.realmImportConfigMap }}
        {{- end }}
        {{- if .Values.keycloak.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "onibex-ask.fullname" . }}-keycloak
        {{- end }}
      {{- with .Values.keycloak.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.keycloak.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.keycloak.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
