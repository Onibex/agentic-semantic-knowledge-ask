# ─────────────────────────────────────────────────────────────────────────────
# TEMPLATE. Placeholders only, and never commit a filled copy of this file.
#
#   cp secret.example.yaml /tmp/ask-secrets.yaml   # outside the repo
#   $EDITOR /tmp/ask-secrets.yaml
#   kubectl apply -f /tmp/ask-secrets.yaml
#
# Applying it unedited does not silently half-work: a malformed encryption key
# is rejected at boot by validate_master_key() and a wrong OpenSearch password
# fails the connection. Both fail loudly, which is the intended behaviour.
#
# WHY ONLY THREE SECRETS LIVE HERE
#
# Everything else the platform holds (LLM provider keys, embedder credentials,
# database connections and, since 2026-09-09, the SAP connection password) is
# Fernet-encrypted inside OpenSearch and is entered through the Setup UI. These
# three are the irreducible ones, because each is needed BEFORE the store can
# be read.
#
#   ONIBEX_ENCRYPTION_KEY  Decrypts everything stored in OpenSearch.
#                          *** IT MUST BE BYTE-IDENTICAL ACROSS UPGRADES AND
#                          REDEPLOYS. *** Changing it is not a rotation, it is a
#                          data-loss event: every stored secret becomes
#                          unreadable and has to be re-entered by hand. Generate
#                          it ONCE per environment and keep it in a vault.
#
#   OPENSEARCH_PASSWORD    Bootstrap of the store that holds all the rest. The
#   plus host              address cannot be read out of OpenSearch itself, so
#                          host and port travel with it.
#
#   KC_ADMIN_PASSWORD      Keycloak bootstrap, and only while Keycloak is part
#                          of the deployment rather than an external IdP.
#
# Generate real values with:
#   ONIBEX_ENCRYPTION_KEY  python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
#   passwords              openssl rand -base64 24
# ─────────────────────────────────────────────────────────────────────────────
---
apiVersion: v1
kind: Secret
metadata:
  name: ask-platform-secret
  namespace: onibex-ask
  labels:
    app.kubernetes.io/part-of: onibex-ask
type: Opaque
stringData:
  # A 44-character urlsafe-base64 Fernet key. Read the warning above before
  # you replace an existing one.
  encryption-key: "REPLACE_ME_WITH_A_FERNET_KEY"
  # OpenSearch is env-first everywhere: these become OPENSEARCH_* in both
  # backends. Host and port are not sensitive, but they are the bootstrap pair
  # for the store, so they are kept with the password rather than split across
  # two objects that can drift.
  opensearch-host: "opensearch.onibex-ask.svc.cluster.local"
  opensearch-port: "9200"
  opensearch-use-ssl: "false"
  opensearch-user: "admin"
  opensearch-password: "REPLACE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-ask-secret
  namespace: onibex-ask
  labels:
    app.kubernetes.io/part-of: onibex-ask
type: Opaque
stringData:
  # What the token validators actually read is KEYCLOAK_JWKS_URL. The previous
  # manifest published an `issuer` key instead, which no code path reads.
  jwks-url: "https://keycloak.example.com/realms/ask-platform/protocol/openid-connect/certs"
  # Consumed by the Keycloak deployment itself, which is deliberately NOT in
  # this folder (three services in, three services out). Kept here so the
  # rotation checklist has one place to look.
  admin-password: "REPLACE_ME"
---
# BTP only. On EKS and AKS this Secret does not exist, and that is fine: every
# XSUAA reference in the two Deployments is marked `optional: true`, so the pods
# start without it. Fill it in when the Kyma target comes up.
apiVersion: v1
kind: Secret
metadata:
  name: xsuaa-ask-secret
  namespace: onibex-ask
  labels:
    app.kubernetes.io/part-of: onibex-ask
type: Opaque
stringData:
  # From the service key of the XSUAA instance. `url` is the one the validator
  # needs (it derives the JWKS endpoint as <url>/token_keys); the other five
  # are read by the orchestrator's Settings for the credential shape.
  url: "https://<subdomain>.authentication.<region>.hana.ondemand.com"
  clientid: "REPLACE_ME"
  clientsecret: "REPLACE_ME"
  uaadomain: "authentication.<region>.hana.ondemand.com"
  verificationkey: "REPLACE_ME"
  xsappname: "REPLACE_ME"
