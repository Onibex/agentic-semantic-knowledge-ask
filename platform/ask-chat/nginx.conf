server {
    listen      80;
    server_name _;
    root        /usr/share/nginx/html;
    index       index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml;

    client_max_body_size 100M;

    # Runtime configuration, written by the entrypoint at container start.
    # NEVER cached: without this a redeploy with new values keeps serving the
    # old auth configuration out of the browser cache, which looks like an
    # authentication bug with no bad code anywhere.
    #
    # An exact-match location wins over the regex below, so this must stay a
    # `location =` or /config.js inherits the immutable caching for assets.
    location = /config.js {
        add_header Cache-Control "no-store" always;
        include /etc/nginx/ask/security-headers.conf;
    }

    location ~* \.(js|css|woff2?|ttf|eot|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/ask/security-headers.conf;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        expires -1;
        include /etc/nginx/ask/security-headers.conf;
    }

    # Orchestrator: /api/orchestrator/* → http://ask-orchestrator:8080/v1/*
    location /api/orchestrator/ {
        proxy_pass          http://ask-orchestrator:8080/v1/;
        # `Host` IS THE UPSTREAM'S NAME, NOT THE BROWSER'S, AND THAT IS
        # LOAD-BEARING. It used to be `$host`, which forwards whatever the
        # browser asked for, and that is fatal inside a service mesh: Envoy
        # routes outbound calls by the authority header, so a request to
        # ask-orchestrator:8080 carrying `Host: ask-chat.<cluster domain>`
        # matches no route, falls through to plain TCP passthrough, and is
        # refused by mTLS at the far end. The browser sees 503 with `upstream
        # connect error ... connection termination`, which looks like the
        # backend being down while it is healthy and answers the identical
        # request one header apart. Measured on Kyma 2026-09-23.
        #
        # `$proxy_host` is nginx's own default here, so this states the decision
        # rather than changing behaviour, and stops `$host` being put back. The
        # caller's original host still travels on the X-Forwarded-* headers.
        proxy_set_header    Host              $proxy_host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_buffering     off;
    }

    # Admin API: /api/admin/* → http://ask-admin-api:8081/v1/admin/*
    location /api/admin/ {
        proxy_pass          http://ask-admin-api:8081/v1/admin/;
        # The upstream's name, not the browser's. See /api/orchestrator/ above.
        proxy_set_header    Host              $proxy_host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_buffering     off;
    }

    # SPA fallback
    # The security headers are repeated in every location that serves content
    # rather than declared once at server level. nginx's add_header does NOT
    # inherit into a location that declares any add_header of its own, so a
    # server-level CSP would silently vanish from exactly the locations that
    # set Cache-Control.
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/ask/security-headers.conf;
    }
}
