server {
    listen      80;
    server_name _;
    root        /usr/share/nginx/html;
    index       index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml;

    client_max_body_size 100M;

    # Runtime configuration, written by the entrypoint at container start.
    # NEVER cached: without this a redeploy with new values keeps serving the
    # old auth configuration out of the browser cache, which looks like an
    # authentication bug with no bad code anywhere.
    #
    # An exact-match location wins over the regex below, so this must stay a
    # `location =` or /config.js inherits the immutable caching for assets.
    location = /config.js {
        add_header Cache-Control "no-store" always;
        include /etc/nginx/ask/security-headers.conf;
    }

    # Assets con hash en el nombre — cache permanente
    location ~* \.(js|css|woff2?|ttf|eot|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/ask/security-headers.conf;
    }

    # index.html — NUNCA cachear. Es el entry point: si se cachea, el browser
    # sigue sirviendo un index viejo que apunta a un bundle viejo (los assets son
    # immutable), y un rebuild no se ve hasta limpiar cache. no-cache fuerza
    # revalidación → cada build nuevo se toma de inmediato.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        expires -1;
        include /etc/nginx/ask/security-headers.conf;
    }

    # Admin CRUD endpoints: /api/admin/* → /v1/admin/*
    #
    # `Host` IS THE UPSTREAM'S NAME, NOT THE BROWSER'S, AND THAT IS LOAD-BEARING.
    # It used to be `$host`, which forwards whatever the browser asked for, and
    # that is fatal inside a service mesh: Envoy routes outbound calls by the
    # authority header, so a request to ask-admin-api:8081 carrying
    # `Host: ask-studio.<cluster domain>` matches no route, falls through to
    # plain TCP passthrough, and is then refused by mTLS at the far end. What
    # the browser sees is 503 with `upstream connect error ... connection
    # termination`, which looks like the backend being down while the backend is
    # perfectly healthy and answers the identical request one header apart.
    #
    # Measured on Kyma 2026-09-23. `$proxy_host` is nginx's own default here, so
    # this line exists to state the decision rather than to change behaviour, and
    # to stop `$host` being put back. The caller's original host still travels,
    # on X-Forwarded-For and X-Forwarded-Proto below.
    location /api/admin/ {
        proxy_pass          http://ask-admin-api:8081/v1/admin/;
        proxy_set_header    Host              $proxy_host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_buffering     off;
    }

    # Viz API proxy — equivalente al proxy Vite en dev:
    #   /api/yamls  →  http://ask-admin-api:8081/v1/viz/yamls
    location /api/ {
        proxy_pass          http://ask-admin-api:8081/v1/viz/;
        # The upstream's name, not the browser's. See /api/admin/ above.
        proxy_set_header    Host              $proxy_host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_read_timeout  60s;
        proxy_buffering     off;          # necesario para SSE (event-stream)
    }

    # SPA fallback — todas las rutas React apuntan a index.html
    #
    # The security headers are repeated in every location that serves content
    # rather than declared once at server level. That is not duplication for
    # its own sake: nginx's add_header does NOT inherit into a location that
    # declares any add_header of its own, so a server-level CSP would silently
    # vanish from exactly the locations that set Cache-Control.
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/ask/security-headers.conf;
    }
}
