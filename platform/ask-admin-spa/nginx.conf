server {
    listen      80;
    server_name _;
    root        /usr/share/nginx/html;
    index       index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml;

    client_max_body_size 100M;

    # Assets con hash en el nombre — cache permanente
    location ~* \.(js|css|woff2?|ttf|eot|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html — NUNCA cachear. Es el entry point: si se cachea, el browser
    # sigue sirviendo un index viejo que apunta a un bundle viejo (los assets son
    # immutable), y un rebuild no se ve hasta limpiar cache. no-cache fuerza
    # revalidación → cada build nuevo se toma de inmediato.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        expires -1;
    }

    # Admin CRUD endpoints: /api/admin/* → /v1/admin/*
    location /api/admin/ {
        proxy_pass          http://ask-admin-api:8081/v1/admin/;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_buffering     off;
    }

    # Viz API proxy — equivalente al proxy Vite en dev:
    #   /api/yamls  →  http://ask-admin-api:8081/v1/viz/yamls
    location /api/ {
        proxy_pass          http://ask-admin-api:8081/v1/viz/;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_read_timeout  60s;
        proxy_buffering     off;          # necesario para SSE (event-stream)
    }

    # SPA fallback — todas las rutas React apuntan a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
