id: silver_s4h_sd_customer_master
internal_id: s4h_100_31
db_table_name: SILVER_SD_CUSTOMER_MASTER
layer: silver
version: '1'
source_system: s4h
source_system_no: 100
business_process: ORDER TO CASH
module: SD
tag1: ''
tag2: SD-MD
name: customer_master
classification: M
description: 'Customer master built from KNA1 + KNB1 (company codes) + KNVK (contacts) + KNVV (sales areas) + KNVP (partner functions): one row per customer per company code, contact, sales area and partner-function occurrence. Use to resolve customer names and attributes for customer 360, credit limits, territory assignment and sales-area analytics; a join on `kunnr_kna1` alone matches several rows per customer, so deduplicate before aggregating.'
entity_role: dimension
grain:
  entity_grain:
    - kunnr_kna1
    - bukrs_knb1
    - parnr_knvk
    - vkorg_knvv
    - vtweg_knvv
    - spart_knvv
    - parvw_knvp
    - parza_knvp
  business_grain: customer_master_item
composed_of:
  - bronze_s4h_kna1_customer_master_data
  - bronze_s4h_knb1_customer_society
  - bronze_s4h_knvk_customer_contact
  - bronze_s4h_knvp_customer_function_data
  - bronze_s4h_knvv_customer_master_sales_data
join_graph:
  - left_table: KNA1
    right_table: KNB1
    join_type: INNER
    condition: KNA1.KUNNR = KNB1.KUNNR
    sequence: 2
  - left_table: KNA1
    right_table: KNVK
    join_type: LEFT OUTER
    condition: KNA1.KUNNR = KNVK.KUNNR
    sequence: 3
  - left_table: KNA1
    right_table: KNVV
    join_type: LEFT OUTER
    condition: KNA1.KUNNR = KNVV.KUNNR
    sequence: 4
  - left_table: KNVV
    right_table: KNVP
    join_type: INNER
    condition: KNVV.KUNNR = KNVP.KUNNR AND KNVV.SPART = KNVP.SPART AND KNVV.VKORG = KNVP.VKORG AND KNVV.VTWEG = KNVP.VTWEG
    sequence: 5
