id: "gold_s4h_order_tracking_reception"
internal_id: "gold_s4h_order_tracking_reception"
db_table_name: GOLD_ORDER_TRACKING_RECEPTION
layer: "gold"
version: "1"
source_system: "s4h"
source_system_no: 100
business_process: "INVENTORY SITUATION"
module: ["MM", "PP", "SD"]
tag1: "SCM"
tag2: "MM"
name: "order_tracking_reception"
classification: "T"
description: "Incoming supply and outgoing demand per order line and reception date. Each row carries its quantity in ONE of the qty_* columns and zero in the others — read the column matching `operation`, never their sum. For the aggregated daily projection use gold_inventory_situation."
entity_role: "fact"
grain:
  entity_grain: ["client", "operation", "order", "item", "date_reception"]
  business_grain: "order_item_operation_reception_level"

fields:
  - name: "client"
    field_role: "identifier"
    type: "STRING(6)"
    description: "SAP Client"
  - name: "operation"
    field_role: "identifier"
    type: "STRING(16)"
    description: "Operation type — discriminator field. Possible values: 'Production Order', 'Sale Order', 'Purchase Order', 'Stock Order' (intra-company stock transfer, derived from EKPO.PSTYP='7'). Use to filter by supply/demand source."
  - name: "order"
    field_role: "identifier"
    type: "STRING(24)"
    description: "Order document number. Which document type it belongs to is in `operation`."
  - name: "item"
    field_role: "identifier"
    type: "INTEGER"
    description: "Line item number within the order document."
  - name: "plant_id"
    field_role: "dimension"
    type: "STRING(8)"
    description: "Plant Number / Plant ID"
    synonyms:
      - site
      - plant code
      - werks
  - name: "material_id"
    field_role: "dimension"
    type: "STRING(80)"
    description: "Material Number / Material ID"
    synonyms:
      - SKU
      - part number
      - material number
  - name: "date_reception"
    field_role: "timestamp"
    type: "STRING(16)"
    description: "Expected reception date, stored as a 'YYYY-MM-DD' string. The source SAP field varies by operation: Production Order = AFPO.DGLTS (scheduled production end), Sale Order = VBAK.VDATU (requested delivery), Purchase / Stock Order = EKET.SLFDT (schedule-line statistical delivery)."
  - name: "date_reception_ts"
    field_role: "timestamp"
    type: "TIMESTAMP"
    description: "Expected or actual reception date as Timestamp"
  - name: "qty_production_order"
    field_role: "measure"
    type: "DECIMAL"
    description: "Production-order quantity (AFPO.PSMNG). SPARSE: populated only on rows where operation = 'Production Order', 0 elsewhere."
    aggregation_behavior: "SUM"

  - name: "qty_purchase_order"
    field_role: "measure"
    type: "DECIMAL"
    description: "Purchase-order quantity (EKPO.MENGE where PSTYP<>'7'). Procurement supply / incoming from supplier. SPARSE: populated only on rows where operation = 'Purchase Order', 0 elsewhere."
    aggregation_behavior: "SUM"

  - name: "qty_stock_order"
    field_role: "measure"
    type: "DECIMAL"
    description: "Stock-transfer quantity (EKPO.MENGE where PSTYP='7'). Intra-company / inter-plant transfer. SPARSE: populated only on rows where operation = 'Stock Order', 0 elsewhere."
    aggregation_behavior: "SUM"

  - name: "qty_sale_order"
    field_role: "measure"
    type: "DECIMAL"
    description: "Sales-order DEMAND quantity (VBAP.KWMENG). Outbound customer demand — NOT a supply receiving. SPARSE: populated only on rows where operation = 'Sale Order', 0 elsewhere."
    aggregation_behavior: "SUM"

  - name: "month_reception"
    field_role: "dimension"
    type: "STRING(7)"
    description: "Reception month as 'YYYY-MM', derived from date_reception. Group by this for a monthly view instead of truncating the date."
  - name: "plant"
    field_role: "dimension"
    type: "STRING(60)"
    description: "Plant name. For the code use `plant_id`."
  - name: "material"
    field_role: "dimension"
    type: "STRING(80)"
    description: "Material description. For the number use `material_id`."
  - name: "order_status"
    field_role: "status_flag"
    type: "STRING(5)"
    description: "'OPEN' or 'CLOSE' — the stored value is 'CLOSE', with no D. The rule differs per operation: Production = OPEN while AFPO.DGLTS is set and AUERU <> 'X'; Sale Order = CLOSE when VBAK.GBSTK = 'C'; Purchase / Stock Order = OPEN while SLFDT is set, MENGE <> 0, ELIKZ <> 'X' and MATNR is set."
  - name: "loaded_at"
    field_role: "timestamp"
    type: "TIMESTAMP"
    description: "ETL load timestamp into this gold table (CURRENT_TIMESTAMP at MERGE time)."
  - name: event_ts
    field_role: timestamp
    description: Last source-system event timestamp contributing to this row. Use to judge data freshness or filter recent changes.
    type: TIMESTAMP
relationships:
  - target_entity: "silver_s4h_sd_trading_goods"
    relationship_type: "many_to_one"
    join_condition: "GOLD_ORDER_TRACKING_RECEPTION.material_id = SILVER_TRADING_GOODS.matnr_mara"
    semantic_label: "material_detail_of"
    traversal_cost: 2
    aggregation_safety: "safe"
    cross_module: true
    description: "Join to Material Master for global attributes"
  - target_entity: "silver_s4h_sd_plant"
    relationship_type: "many_to_one"
    join_condition: "GOLD_ORDER_TRACKING_RECEPTION.plant_id = SILVER_PLANTS.werks_t001w"
    semantic_label: "received_at_plant"
    traversal_cost: 2
    aggregation_safety: "safe"
    cross_module: true
    description: "Join to Plant Master for location details"

  - target_entity: "silver_s4h_mm_purchase_order"
    relationship_type: "many_to_many"
    join_condition: "GOLD_ORDER_TRACKING_RECEPTION.client = SILVER_MM_PURCHASE_ORDER.mandt_ekko AND GOLD_ORDER_TRACKING_RECEPTION.order = SILVER_MM_PURCHASE_ORDER.ebeln_ekko AND GOLD_ORDER_TRACKING_RECEPTION.item = SILVER_MM_PURCHASE_ORDER.ebelp_ekpo AND GOLD_ORDER_TRACKING_RECEPTION.operation IN ('Purchase Order', 'Stock Order')"
    semantic_label: "tracks_purchase_order"
    traversal_cost: 3
    aggregation_safety: "requires_dedup"
    cross_module: true
    description: "Procurement lineage. Valid ONLY for operation IN ('Purchase Order', 'Stock Order') — both are EKPO rows (PSTYP='7' marks the stock-transfer case), so ONE edge serves TWO operation values. The operation predicate is part of the join, not an optional hint: without it the join matches Production/Sale rows whose order number happens to collide. Traverse for supplier, PO document type, account assignment and schedule-line detail. GRAIN CHANGES (client+operation+order+item+date_reception -> BANFN+BNFPO+ZEBKN+EBELN+EBELP+ETENR+ZEKKN): the predicate pins only MANDT+EBELN+EBELP, leaving ETENR, ZEKKN and the requisition keys unpinned, and this gold carries one row per schedule-line date — so rows multiply on BOTH sides. Never SUM qty_purchase_order / qty_stock_order after this join without first reducing each side to its own grain."

  - target_entity: "silver_s4h_pp_production_confirmation"
    relationship_type: "one_to_many"
    join_condition: "GOLD_ORDER_TRACKING_RECEPTION.client = SILVER_PP_PRODUCTION_CONFIRMATION.mandt_afko AND GOLD_ORDER_TRACKING_RECEPTION.order = SILVER_PP_PRODUCTION_CONFIRMATION.aufnr_afko AND GOLD_ORDER_TRACKING_RECEPTION.item = SILVER_PP_PRODUCTION_CONFIRMATION.posnr_afpo AND GOLD_ORDER_TRACKING_RECEPTION.operation = 'Production Order'"
    semantic_label: "tracks_production_order"
    traversal_cost: 3
    aggregation_safety: "requires_dedup"
    cross_module: true
    description: "Production lineage. Valid ONLY for operation = 'Production Order'; the operation predicate is part of the join, not an optional hint — order numbers are not unique across operation types. Traverse for order header (AFKO), order item (AFPO), confirmations (AFRU) and actual costs (AUFK). GRAIN CHANGES (client+operation+order+item -> AUFNR+POSNR+RUECK+RMZHL): the predicate pins MANDT+AUFNR+POSNR, leaving RUECK (confirmation number) and RMZHL (counter) unpinned, so one gold row fans out to every confirmation posting on that order item. Never SUM qty_production_order after this join without first reducing this gold to one row per its own grain."

  - target_entity: "silver_s4h_sd_sales_order"
    relationship_type: "one_to_many"
    join_condition: "GOLD_ORDER_TRACKING_RECEPTION.client = SILVER_SD_SALES_ORDER.mandt_vbak AND GOLD_ORDER_TRACKING_RECEPTION.order = SILVER_SD_SALES_ORDER.vbeln_vbak AND GOLD_ORDER_TRACKING_RECEPTION.item = SILVER_SD_SALES_ORDER.posnr_vbap AND GOLD_ORDER_TRACKING_RECEPTION.operation = 'Sale Order'"
    semantic_label: "tracks_sales_order"
    traversal_cost: 3
    aggregation_safety: "requires_dedup"
    cross_module: true
    description: "Demand-side lineage. Valid ONLY for operation = 'Sale Order'; the operation predicate is part of the join, not an optional hint — order numbers are not unique across operation types. Traverse for sales document header, line items, document flow and commercial terms. GRAIN CHANGES (client+operation+order+item -> VBELN+POSNR+VBELV+POSNV+POSNN+VBTYP_N+PARVW): the predicate pins MANDT+VBELN+POSNR, leaving the document-flow keys and PARVW (partner function) unpinned, so one gold row fans out to (successor documents x partner functions) rows. Never SUM qty_sale_order after this join without first reducing this gold to one row per its own grain. For a pre-flattened one-row-per-line SD view, prefer gold_s4h_sd_open_order_tracker."

  - target_entity: "gold_s4h_mm_inventory_position"
    relationship_type: "many_to_one"
    join_condition: "GOLD_ORDER_TRACKING_RECEPTION.client = GOLD_MM_INVENTORY_POSITION.client AND GOLD_ORDER_TRACKING_RECEPTION.plant_id = GOLD_MM_INVENTORY_POSITION.plant_id AND GOLD_ORDER_TRACKING_RECEPTION.material_id = GOLD_MM_INVENTORY_POSITION.material_id"
    semantic_label: "current_stock_context"
    traversal_cost: 3
    aggregation_safety: "safe"
    cross_module: false
    description: "Cross-fact lookup: enrich each pending reception (PO / Production / Stock Transfer / SO arrival) with the current stock position of its (plant, material). Use to evaluate post-reception state: 'will this arrival push us over max_level?', 'does this delivery cover the current shortfall vs safety_stk?', 'which incoming receptions land into already-balanced stock vs critical materials?'."
